<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مانا — تبدیل متن به گفتار</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>مانا <span class="subtitle">تبدیل متن فارسی به گفتار • آفلاین</span></h1>
    <button id="themeBtn" class="icon-btn" title="تغییر تم">◐</button>
  </header>

  <main>
    <section class="card">
      <label class="field-label" for="text">متن فارسی</label>
      <textarea id="text" rows="5" maxlength="10000" placeholder="متن را اینجا بنویسید…"></textarea>
      <div class="row between">
        <div class="samples">
          <button class="chip" data-sample="سلام به همگی!">سلام</button>
          <button class="chip" data-sample="سیستم تبدیل متن به گفتار آفلاین مانا آماده است.">تست سیستم</button>
          <button class="chip" data-sample="امروز هوا چطور است؟">سؤالی</button>
        </div>
        <div class="row">
          <span id="charCount" class="muted">۰ / ۱۰۰۰۰</span>
          <button id="clearBtn" class="ghost-btn">پاک کردن</button>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="row">
        <div class="control">
          <label for="speed">سرعت: <b id="speedVal">۱٫۰×</b></label>
          <input id="speed" type="range" min="0.5" max="2" step="0.05" value="1" />
        </div>
        <button id="speakBtn" class="primary-btn">تولید و پخش صدا</button>
      </div>
      <canvas id="wave" height="72"></canvas>
      <div class="row between">
        <span id="duration" class="muted"></span>
        <span id="status" class="status"></span>
      </div>
    </section>

    <section class="card">
      <h2>ذخیره خروجی</h2>
      <div class="row wrap">
        <input id="folder" class="folder-input" type="text" placeholder="پوشه خروجی…" />
        <button id="pickFolderBtn" class="ghost-btn">انتخاب پوشه…</button>
        <button id="defaultFolderBtn" class="ghost-btn">پوشه پیش‌فرض</button>
        <button id="saveBtn" class="primary-btn" disabled>دانلود WAV</button>
      </div>
      <p class="muted small">اگر خالی بماند، فایل کنار برنامه ذخیره می‌شود.</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
