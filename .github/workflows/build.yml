name: Desktop App (Linux / Windows / macOS)

on:
  push:
    branches: [main, master]
    tags: ["v*"]
    paths-ignore:
      - "android/**"
      - "scripts/import_android_app.py"
      - "scripts/rebrand_android.py"
      - "scripts/android_model.py"
  pull_request:
    paths-ignore:
      - "android/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  app:
    strategy:
      fail-fast: false
      matrix:
        include:
          # NOTE: `bundles` must stay quoted. In a YAML flow mapping a bare
          # comma is a separator, so `bundles: appimage,deb` parses as
          # {bundles: appimage, deb: null} and the .deb silently never gets
          # built. The Build step asserts the value round-trips.
          - { os: ubuntu-22.04,  target: x86_64-unknown-linux-gnu, bundles: "appimage,deb" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,    bundles: nsis }
          - { os: macos-latest,   target: x86_64-apple-darwin,      bundles: dmg }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libasound2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Documented prerequisite for Windows/macOS, and the engine the app
      # falls back to there. Installed (and smoke-tested) on every runner so
      # the fallback test in `cargo test` runs everywhere.
      - name: Install piper-tts (documented prerequisite)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install piper-tts
          python -m piper --help > /dev/null && echo "piper-tts CLI ok"

      - name: Download Mana model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p models
          curl -fL --retry 3 https://huggingface.co/MahtaFetrat/Mana-Persian-Piper/resolve/main/fa_IR-mana-medium.onnx \
            -o models/fa_IR-mana-medium.onnx
          curl -fL --retry 3 https://huggingface.co/MahtaFetrat/Mana-Persian-Piper/resolve/main/fa_IR-mana-medium.onnx.json \
            -o models/fa_IR-mana-medium.onnx.json
          python -c "import json,io; c=json.load(io.open('models/fa_IR-mana-medium.onnx.json',encoding='utf-8')); assert c['audio']['sample_rate']==22050; print('model config ok')"

      # Native engine exists for Linux only (official rhasspy release).
      # Windows/macOS use the piper-tts package installed above.
      - name: Download native piper engine (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools
          curl -fL --retry 3 https://github.com/rhasspy/piper/releases/download/v1.2.0/piper_amd64.tar.gz \
            -o tools/piper_amd64.tar.gz
          tar -xzf tools/piper_amd64.tar.gz -C tools/
          ./tools/piper/piper --help | head -3
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path("src-tauri/tauri.conf.json")
          cfg = json.loads(p.read_text(encoding="utf-8"))
          cfg["bundle"]["resources"] += [
              "../tools/piper/piper",
              "../tools/piper/*.so*",
              "../tools/piper/espeak-ng-data",
          ]
          p.write_text(json.dumps(cfg, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          print("resources:", len(cfg["bundle"]["resources"]))
          PY

      - name: Run tests (core, fallback path, app logic)
        shell: bash
        run: |
          # The committed config must stay portable: any OS-specific engine
          # path (e.g. tools/piper) breaks the other two runners at bundle
          # time with a bare 'resource path doesn't exist'. NOTE: this checks
          # the committed file (HEAD), because earlier steps legitimately
          # append the platform engine to the working tree on Linux.
          python - <<'PY'
          import json, subprocess, sys
          raw = subprocess.run(
              ["git", "show", "HEAD:src-tauri/tauri.conf.json"],
              capture_output=True, text=True, encoding="utf-8",
          ).stdout
          cfg = json.loads(raw)
          bad = [r for r in cfg["bundle"]["resources"] if "tools/" in r]
          if bad:
              sys.exit(f"non-portable resources committed in tauri.conf.json: {bad}")
          print("committed resources are portable")
          PY
          cargo test --workspace

      # Official Tauri CLI. Deliberately NOT tauri-apps/tauri-action: that
      # action creates a GitHub release from every matrix job, which both
      # bursts the GITHUB_TOKEN installation rate limit and leaves junk
      # releases behind. Building here and publishing once in the `release`
      # job keeps a single, correctly named release.
      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@2

      - name: Build app
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BUNDLES: ${{ matrix.bundles }}
        run: |
          set -euo pipefail
          # Guard: an unquoted "appimage,deb" in the matrix flow mapping is
          # parsed as bundles=appimage plus a stray deb key, so the .deb is
          # never built and every downstream step fails confusingly.
          echo "target=$TARGET bundles='$BUNDLES'"
          test -n "$BUNDLES"
          if [ "$RUNNER_OS" = "Linux" ]; then
            for want in appimage deb; do
              case ",$BUNDLES," in
                *,$want,*) echo "  has $want" ;;
                *) echo "Linux build is missing '$want' (bundle list: '$BUNDLES')"; exit 1 ;;
              esac
            done
          fi
          tauri build --target "$TARGET" --bundles "$BUNDLES"

      # Copy just the installers into one flat directory so each artifact is a
      # flat file list. Uploading the whole bundle/ directory pulled in .sig
      # files and an AppImage.tar.gz copy, and the nested layout made the
      # download side fragile.
      - name: Stage installers
        shell: bash
        run: |
          set -euo pipefail
          bundle="target/${{ matrix.target }}/release/bundle"
          test -d "$bundle" || { echo "no bundle dir at $bundle"; ls -R target/${{ matrix.target }}/release | head -40; exit 1; }
          mkdir -p staged
          find "$bundle" -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.exe' -o -name '*.dmg' \) \
            -exec cp -v {} staged/ \;
          echo "staged:"
          ls -lh staged/
          test -n "$(ls -A staged)"

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: staged/
          if-no-files-found: error

  # One release with all three OS downloads, created after the builds finish.
  # Cheaper on the API and better for users than one release per OS.
  release:
    needs: app
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: dist
          merge-multiple: true

      # Verify each expected installer by name, and print what actually landed
      # so a future mismatch is diagnosable from the log alone.
      - name: Verify installers
        run: |
          set -euo pipefail
          echo "downloaded files:"
          find dist -type f -printf '%10s  %p\n' | sort -k2
          missing=0
          for ext in AppImage deb exe dmg; do
            n=$(find dist -type f -name "*.$ext" | wc -l)
            echo "  .$ext -> $n"
            [ "$n" -ge 1 ] || { echo "MISSING .$ext"; missing=1; }
          done
          test "$missing" -eq 0

      - uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/*
          file_glob: true
          tag: desktop-latest
          release_name: "ManaTTS Desktop (Linux / Windows / macOS)"
          body: |
            Persian offline text-to-speech with the Mana voice.

            | OS | File | Prerequisites |
            |---|---|---|
            | Linux | `ManaTTS_*_amd64.AppImage` | none |
            | Linux | `ManaTTS_*_amd64.deb` | none |
            | Windows | `ManaTTS_*_x64-setup.exe` | Python 3.10+ then `pip install piper-tts` |
            | macOS | `ManaTTS_*_x64.dmg` | Python 3.10+ then `pip install piper-tts` |

            After launch the app serves a local OpenAI-compatible API on
            http://127.0.0.1:7788 — see the README for details.
          overwrite: true
