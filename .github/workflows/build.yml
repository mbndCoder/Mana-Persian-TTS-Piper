name: Build ManaTTS

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libasound2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The 61MB model is git-ignored; every platform fetches it here.
      - name: Download Mana model
        shell: bash
        run: |
          mkdir -p models
          curl -L https://huggingface.co/MahtaFetrat/Mana-Persian-Piper/resolve/main/fa_IR-mana-medium.onnx \
            -o models/fa_IR-mana-medium.onnx
          curl -L https://huggingface.co/MahtaFetrat/Mana-Persian-Piper/resolve/main/fa_IR-mana-medium.onnx.json \
            -o models/fa_IR-mana-medium.onnx.json
          python3 -c "import json; c=json.load(open('models/fa_IR-mana-medium.onnx.json')); assert c['audio']['sample_rate']==22050; print('model config ok')"

      # Native engine is bundled on Linux only. Windows/macOS use the
      # `python -m piper` fallback (pip installs piper-tts at runtime;
      # see README "Prerequisites").
      - name: Download native piper engine (Linux only)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p tools
          curl -L https://github.com/rhasspy/piper/releases/download/v1.2.0/piper_amd64.tar.gz \
            -o tools/piper_amd64.tar.gz
          tar -xzf tools/piper_amd64.tar.gz -C tools/
          ./tools/piper/piper --help | head -3
          # Bundle it as a resource by extending the tauri config for this
          # platform only (the config is not portable across OSes).
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("src-tauri/tauri.conf.json")
          cfg = json.loads(p.read_text())
          cfg["bundle"]["resources"] += [
              "../tools/piper/piper",
              "../tools/piper/*.so*",
              "../tools/piper/espeak-ng-data",
          ]
          p.write_text(json.dumps(cfg, indent=2) + "\n")
          print("resources:", cfg["bundle"]["resources"])
          PY

      - name: Verify engine fallback is installed (Windows/macOS)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install piper-tts
          python -c "import piper; print('piper-tts ready')"
          echo 'سلام' | python -m piper --help > /dev/null

      - name: Build frontend assets check
        shell: bash
        run: |
          test -f src/index.html
          test -f src-tauri/tauri.conf.json

      - name: Build app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v${{ github.run_number }}
          releaseName: "ManaTTS v${{ github.run_number }}"
          releaseBody: |
            Persian offline TTS (Mana Piper voice).
            Windows/macOS need: pip install piper-tts
          releaseDraft: true
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: manatts-${{ matrix.target }}
          # The workspace target dir is at the repo root, not under src-tauri.
          path: |
            target/${{ matrix.target }}/release/bundle/
            target/release/bundle/
          if-no-files-found: error
