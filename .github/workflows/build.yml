name: Build ManaTTS

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  engine:
    # One self-contained `piper` executable per platform, so the shipped app
    # needs no Python and no system packages anywhere.
    name: engine-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux,   os: ubuntu-22.04 }
          - { name: windows, os: windows-latest }
          - { name: macos,   os: macos-latest }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build engine
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pyinstaller piper-tts
          # bash on Windows runners
          git config --global core.autocrlf false
          bash ./scripts/build_engine.sh
          ls -l tools/piper

      - name: Smoke-test the engine
        shell: bash
        run: |
          set -euo pipefail
          ENG=tools/piper/piper
          [ "$RUNNER_OS" = "Windows" ] && ENG=tools/piper/piper.exe
          # piper needs the sidecar config; without it the run fails with
          # a bare FileNotFoundError and the real cause is easy to miss.
          curl -fL --retry 3 https://huggingface.co/MahtaFetrat/Mana-Persian-Piper/resolve/main/fa_IR-mana-medium.onnx -o m.onnx
          curl -fL --retry 3 https://huggingface.co/MahtaFetrat/Mana-Persian-Piper/resolve/main/fa_IR-mana-medium.onnx.json -o m.onnx.json
          echo 'سلام دنیا، تست موتور مستقل.' | "$ENG" -m m.onnx -f out.wav
          # prove it is real speech, not just a non-empty file
          python ./scripts/verify_wav.py out.wav

      - uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.name }}
          path: tools/piper/
          if-no-files-found: error
          retention-days: 90

      # Publish the engine next to the app so future builds (and manual
      # downloads) do not depend on rebuilding it with PyInstaller.
      - uses: svenstaro/upload-release-action@v2
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: engines
          file: tools/piper/piper*
          file_glob: true
          overwrite: true

  app:
    needs: engine
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,  target: x86_64-unknown-linux-gnu, bundles: appimage,deb, name: linux }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,    bundles: nsis,         name: windows }
          - { os: macos-latest,   target: x86_64-apple-darwin,      bundles: dmg,          name: macos }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libasound2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download Mana model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p models
          curl -fL --retry 3 https://huggingface.co/MahtaFetrat/Mana-Persian-Piper/resolve/main/fa_IR-mana-medium.onnx \
            -o models/fa_IR-mana-medium.onnx
          curl -fL --retry 3 https://huggingface.co/MahtaFetrat/Mana-Persian-Piper/resolve/main/fa_IR-mana-medium.onnx.json \
            -o models/fa_IR-mana-medium.onnx.json
          # explicit utf-8: the Windows runner's default codec is cp1252 and
          # reading the Persian config with it raises UnicodeDecodeError
          python -c "import json,io; c=json.load(io.open('models/fa_IR-mana-medium.onnx.json',encoding='utf-8')); assert c['audio']['sample_rate']==22050; print('model config ok')"

      - name: Fetch the engine built for this platform
        uses: actions/download-artifact@v4
        with:
          name: engine-${{ matrix.name }}
          path: tools/piper

      - name: Bundle the engine as a resource
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path("src-tauri/tauri.conf.json")
          cfg = json.loads(p.read_text(encoding="utf-8"))
          cfg["bundle"]["resources"] += [
              "../tools/piper/piper",
              "../tools/piper/piper.exe",
              "../tools/piper/espeak-ng-data",
          ]
          p.write_text(json.dumps(cfg, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          print("resources:", len(cfg["bundle"]["resources"]))
          PY

      - name: Build app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v${{ github.run_number }}
          releaseName: "ManaTTS v${{ github.run_number }}"
          releaseBody: |
            Persian offline TTS (Mana Piper voice). No Python required.
          releaseDraft: true
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/
            target/release/bundle/
          if-no-files-found: error
